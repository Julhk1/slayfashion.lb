<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SLAY. | Women's Fashion</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap');
    body { font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; }
    .neon-text { text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .snap-x-mandatory { scroll-snap-type: x mandatory; }
    .snap-center { scroll-snap-align: center; }
  </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col antialiased">

  <script>
    const CONFIG = {
      WHATSAPP_NUMBER: "33765231464" // Numéro WhatsApp de test
    };
  </script>

  <!-- Header Clean (Sans Bouton Admin) -->
  <header class="sticky top-0 z-40 bg-black/90 backdrop-blur-md border-b border-zinc-800">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="#" class="text-2xl md:text-3xl font-extrabold tracking-widest text-pink-500 neon-text">SLAY.</a>
      
      <div class="flex items-center gap-3">
        <button onclick="toggleCart()" class="relative text-xl p-2 active:scale-95 transition">
          <i class="fa-solid fa-bag-shopping"></i>
          <span id="cart-count" class="absolute top-0 right-0 bg-pink-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="text-center py-6 md:py-10 px-4 bg-gradient-to-b from-zinc-900 to-black">
    <h1 class="text-2xl md:text-5xl font-black uppercase mb-1">Wear it • Love it • Slay it</h1>
    <p class="text-zinc-400 text-xs md:text-sm">Delivering all over Lebanon • Cash on Delivery</p>
  </section>

  <!-- Categories -->
  <section class="max-w-6xl mx-auto px-4 py-3 w-full">
    <div class="flex space-x-2 overflow-x-auto pb-2 no-scrollbar justify-start md:justify-center" id="categories-container">
      <!-- Dynamic categories -->
    </div>
  </section>

  <!-- Products Grid -->
  <main class="max-w-6xl mx-auto px-3 md:px-4 py-4 flex-grow w-full">
    <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-6">
      <!-- Products loaded from Decap CMS -->
    </div>
  </main>

  <!-- Shopping Bag Sidebar -->
  <div id="cart-sidebar" class="fixed inset-y-0 right-0 w-full max-w-md bg-zinc-900 shadow-2xl z-50 transform translate-x-full transition-transform duration-300 flex flex-col">
    <div class="p-4 border-b border-zinc-800 flex justify-between items-center">
      <h2 class="text-lg font-bold uppercase">Your Shopping Bag</h2>
      <button onclick="toggleCart()" class="text-zinc-400 text-2xl">&times;</button>
    </div>

    <div id="cart-items" class="p-4 overflow-y-auto flex-grow space-y-4">
      <p class="text-zinc-500 text-center py-8">Your bag is empty.</p>
    </div>

    <div class="p-4 border-t border-zinc-800 bg-zinc-950">
      <div class="flex justify-between font-bold text-base mb-3">
        <span>Total:</span>
        <span id="cart-total" class="text-pink-500">$0.00</span>
      </div>

      <form id="checkout-form" onsubmit="processCheckout(event)" class="space-y-3">
        <input type="text" id="cust-name" placeholder="Full Name" required class="w-full bg-zinc-800 text-white rounded p-2.5 text-xs border border-zinc-700">
        
        <div class="flex gap-2">
          <select id="cust-country-code" class="w-28 bg-zinc-800 text-white rounded p-2.5 text-xs border border-zinc-700">
            <option value="+961">🇱🇧 +961</option>
            <option value="+33" selected>🇫🇷 +33</option>
            <option value="+1">🇺🇸 +1</option>
          </select>
          <input type="tel" id="cust-phone" placeholder="Phone Number" required class="flex-1 bg-zinc-800 text-white rounded p-2.5 text-xs border border-zinc-700">
        </div>

        <textarea id="cust-address" placeholder="Delivery Address & City" required rows="2" class="w-full bg-zinc-800 text-white rounded p-2.5 text-xs border border-zinc-700"></textarea>
        
        <button type="submit" class="w-full bg-pink-500 hover:bg-pink-600 active:scale-95 text-white font-bold py-3 rounded uppercase text-xs">
          <i class="fa-brands fa-whatsapp text-base mr-1"></i> Complete Order via WhatsApp
        </button>
      </form>
    </div>
  </div>

  <!-- Receipt Ticket Modal -->
  <div id="receipt-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white text-black p-6 rounded-lg max-w-sm w-full space-y-4 text-sm" id="receipt-content">
      <div class="text-center border-b pb-3">
        <h2 class="text-2xl font-black">SLAY.</h2>
        <p class="text-xs text-gray-500">Official Order Receipt</p>
      </div>

      <div class="space-y-1 text-xs">
        <p><strong>Order ID:</strong> <span id="r-id"></span></p>
        <p><strong>Customer:</strong> <span id="r-name"></span></p>
        <p><strong>Phone:</strong> <span id="r-phone"></span></p>
        <p><strong>Address:</strong> <span id="r-address"></span></p>
      </div>

      <div class="border-t border-b py-2 my-2">
        <div id="r-items" class="space-y-1"></div>
      </div>

      <div class="flex justify-between font-bold text-base">
        <span>Total Due (COD):</span>
        <span id="r-total"></span>
      </div>

      <div class="flex gap-2 pt-2" data-html2canvas-ignore="true">
        <button onclick="downloadPDF()" class="flex-1 bg-zinc-800 text-white py-2 rounded text-xs font-bold">Download Ticket PDF</button>
        <button onclick="closeReceipt()" class="bg-gray-300 text-black px-4 py-2 rounded text-xs font-bold">Close</button>
      </div>
    </div>
  </div>

  <footer class="border-t border-zinc-800 text-center py-6 text-xs text-zinc-500 mt-12">
    <p>&copy; 2026 SLAY. All rights reserved.</p>
  </footer>

  <script>
    let products = [];
    let cart = [];
    let selectedSizes = {};
    let currentCategory = 'All';

    function toggleCart() {
      document.getElementById('cart-sidebar').classList.toggle('translate-x-full');
    }

    function closeReceipt() {
      document.getElementById('receipt-modal').classList.add('hidden');
    }

    function downloadPDF() {
      const element = document.getElementById('receipt-content');
      html2pdf().set({ margin: 10, filename: 'SLAY_Order_Receipt.pdf' }).from(element).save();
    }

    function addToCart(id) {
      const prod = products.find(x => x.id === id);
      if(!prod) return;

      const avail = prod.sizes || ["S", "M", "L", "XL"];
      const chosenSize = selectedSizes[id] || avail[0];

      const existing = cart.find(x => x.id === id && x.selectedSize === chosenSize);
      if(existing) {
        existing.qty++;
      } else {
        cart.push({ ...prod, qty: 1, selectedSize: chosenSize });
      }
      updateCartUI();
      toggleCart();
    }

    function updateCartUI() {
      const container = document.getElementById('cart-items');
      const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      document.getElementById('cart-count').innerText = totalItems;
      document.getElementById('cart-total').innerText = `$${totalPrice.toFixed(2)}`;

      if(cart.length === 0) {
        container.innerHTML = '<p class="text-zinc-500 text-center py-8 text-xs">Your bag is empty.</p>';
        return;
      }

      container.innerHTML = cart.map(item => `
        <div class="flex justify-between items-center border-b border-zinc-800 pb-3 text-xs">
          <div class="flex items-center space-x-3">
            <img src="${item.images ? item.images[0] : item.image}" class="w-10 h-10 object-cover rounded">
            <div>
              <h4 class="font-semibold text-white">${item.title}</h4>
              <p class="text-zinc-400">Size: <span class="text-pink-400 font-bold">${item.selectedSize}</span> • $${Number(item.price).toFixed(2)} x ${item.qty}</p>
            </div>
          </div>
        </div>
      `).join('');
    }

    function processCheckout(e) {
      e.preventDefault();
      if(cart.length === 0) return;

      const name = document.getElementById('cust-name').value;
      const code = document.getElementById('cust-country-code').value;
      const phone = document.getElementById('cust-phone').value;
      const address = document.getElementById('cust-address').value;
      const fullPhone = `${code} ${phone}`;

      const orderId = 'SLAY-' + Math.floor(100000 + Math.random() * 900000);
      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0).toFixed(2);

      document.getElementById('r-id').innerText = orderId;
      document.getElementById('r-name').innerText = name;
      document.getElementById('r-phone').innerText = fullPhone;
      document.getElementById('r-address').innerText = address;
      document.getElementById('r-total').innerText = `$${totalPrice}`;

      document.getElementById('r-items').innerHTML = cart.map(i => `
        <div class="flex justify-between text-xs">
          <span>${i.title} [${i.selectedSize}] (x${i.qty})</span>
          <span>$${(i.price * i.qty).toFixed(2)}</span>
        </div>
      `).join('');

      let waMessage = `*NEW ORDER - ${orderId}*\n\n- Name: ${name}\n- Phone: ${fullPhone}\n- Address: ${address}\n\n*Items:*\n`;
      cart.forEach(i => {
        waMessage += `• ${i.title} [Size: ${i.selectedSize}] (x${i.qty}) - $${(i.price * i.qty).toFixed(2)}\n`;
      });
      waMessage += `\n*Total:* $${totalPrice} (Cash on Delivery)`;

      document.getElementById('receipt-modal').classList.remove('hidden');
      downloadPDF();

      window.open(`https://wa.me/${CONFIG.WHATSAPP_NUMBER}?text=${encodeURIComponent(waMessage)}`, '_blank');

      cart = [];
      updateCartUI();
      toggleCart();
    }
  </script>
</body>
</html>
